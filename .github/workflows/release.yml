name: Release

# Builds Launch Gabi for all three platforms and attaches the installers to the
# GitHub release for the current version. macOS and Linux artifacts cannot be
# produced on a Windows machine, so they are built on GitHub's runners instead.
on:
  push:
    tags:
      - 'v*'
  # Lets you rebuild the current version's assets by hand from the Actions tab.
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      # One at a time: all three upload into the same draft release, and letting
      # them start together makes them race to create it.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build and publish ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without an Apple certificate, auto-discovery would pick up a random
          # keychain identity and fail the macOS build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run publish:${{ matrix.platform }}

  # Every platform uploads into one draft; this turns that draft into the real
  # release exactly once. Without it the draft would sit there invisible and no
  # installed launcher would ever see the update.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Taken from package.json rather than the ref, so a manual re-run from
          # the Actions tab targets the same release a tag push would.
          TAG="v$(node -p "require('./package.json').version")"
          echo "Veröffentliche $TAG"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify the release carries every expected file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          # The three manifests are what the updater reads; a missing one means
          # that platform silently never updates, which is not worth shipping.
          for required in latest.yml latest-mac.yml latest-linux.yml; do
            echo "$ASSETS" | grep -qx "$required" || {
              echo "::error::$required fehlt im Release $TAG"
              exit 1
            }
          done
          # A second release for the same tag is the failure this setup exists
          # to prevent, so it is worth failing loudly on.
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name==\"$TAG\")] | length")
          if [ "$COUNT" != "1" ]; then
            echo "::error::$COUNT Releases mit Tag $TAG gefunden, erwartet genau 1"
            exit 1
          fi
          echo "Release $TAG ist vollständig."
