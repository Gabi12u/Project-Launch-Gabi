name: Release

# Builds Launch Gabi for all three platforms and attaches the installers to one
# GitHub release. macOS and Linux artifacts cannot be produced on a Windows
# machine, so they are built on GitHub's runners instead.
#
# The platform jobs deliberately do NOT publish. Letting electron-builder create
# the release from three separate runners produced two releases for the same
# tag twice in a row: whichever job goes first creates one, and the next does
# not reliably find it. Installers and update manifests then land on different
# releases, and the launcher either sees no update at all or cannot use the
# small differential download. Building into artifacts and assembling one
# release at the end removes the race entirely.
#
# A beta (a tag like v1.0.25-beta.1) takes a different road: no GitHub
# release and no workflow artifacts, because both are public in this
# repository. Each platform job copies its files straight to the beta folder
# on our own server, where only launchers with a beta key can fetch them.
on:
  push:
    tags:
      - 'v*'
  # Lets you rebuild the current version's assets by hand from the Actions tab.
  workflow_dispatch:

# A tag push and a manual rebuild for the same version would both delete and
# recreate the release, so they wait for each other instead of interleaving.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Execute bits only exist on macOS and Linux, so this is the one place
      # the unpacked Java is checked on the systems it actually ships to.
      - name: Java-Archiv mit Ausfuehrrechten entpacken
        run: node scripts/test-java-tar-modes.mjs

      # Cheap, and it runs before three platform builds rather than after them.
      - name: Tag, Version und Changelog vergleichen
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # X.Y.Z for a release, X.Y.Z-beta.N for a beta, nothing else. An
          # "-rc" or "-alpha" would build a manifest no launcher ever reads.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            BETA=true
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BETA=false
          else
            echo "::error::$VERSION ist weder X.Y.Z noch X.Y.Z-beta.N."
            exit 1
          fi
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"

          # The release is assembled from package.json, not from the ref. A tag
          # that says something else therefore does not create the release it
          # names: it overwrites the one package.json points at, which is a
          # version that is already published and already installed by people.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu package.json (v$VERSION)."
            exit 1
          fi

          # Without an entry the launcher points its post-update message at a
          # version that is missing from the list it opens. A beta has none:
          # its notes are written once the betas are rolled into the release.
          if [ "$BETA" = "false" ] && ! grep -q "version: '$VERSION'" src/shared/changelog.ts; then
            echo "::error::In src/shared/changelog.ts fehlt ein Eintrag für $VERSION."
            exit 1
          fi

          echo "Version $VERSION, Beta: $BETA, Tag und Changelog passen zusammen."

      - name: Build ${{ matrix.platform }}
        env:
          # Without an Apple certificate, auto-discovery would pick up a random
          # keychain identity and fail the macOS build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Die Zugangsdaten der Fehlerberichte. Sie stehen bewusst nirgends im
          # Quelltext: die alte Webhook-Adresse tat das, und ein Scanner-Bot
          # hatte sie am 2026-09-08 aus dem oeffentlichen Repository gefischt.
          # Fehlt eines der beiden, baut alles weiter und der jeweilige Weg
          # bleibt in dieser Version einfach aus.
          # Kein Discord-Webhook mehr im Bau: er war aus jeder Installation
          # auslesbar. Der eigene Server leitet jetzt an Discord weiter.
          LG_REPORT_PANEL_TOKEN: ${{ secrets.LG_REPORT_PANEL_TOKEN }}
        run: npm run pack:${{ matrix.platform }}

      # Only the shippable files. `dist/` also holds the unpacked app trees,
      # which are large and useless as release assets.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p upload
          for pattern in '*.exe' '*.dmg' '*.AppImage' '*.blockmap' 'latest*.yml' 'beta*.yml'; do
            find dist -maxdepth 1 -name "$pattern" -exec cp {} upload/ \; 2>/dev/null || true
          done
          # The launcher looks for beta.yml, beta-mac.yml and beta-linux.yml on
          # the beta feed. Should electron-builder have named a beta's manifest
          # after the stable channel, it is renamed here instead of shipping a
          # feed nobody reads.
          if [ "${{ steps.version.outputs.beta }}" = "true" ]; then
            for manifest in upload/latest*.yml; do
              [ -f "$manifest" ] || continue
              target="upload/beta${manifest#upload/latest}"
              [ -f "$target" ] || mv "$manifest" "$target"
              rm -f "$manifest"
            done
            if ! ls upload/beta*.yml >/dev/null 2>&1; then
              echo "::error::Keine beta*.yml gebaut."
              exit 1
            fi
          fi
          echo "Hochzuladen:"
          ls -1 upload

      # Straight to our server: an artifact of this public repository would
      # be downloadable by anyone with a GitHub account for a day. Installers
      # first and the manifest last, each under a temporary name and then
      # renamed, so a launcher never reads a manifest whose file is not there
      # yet.
      - name: Beta auf den eigenen Server legen
        if: steps.version.outputs.beta == 'true'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          BETA_ROOT: ${{ secrets.BETA_ROOT }}
        run: |
          DEST="${BETA_ROOT:-/var/lib/launch-gabi-beta}"
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_beta
          chmod 600 ~/.ssh/id_beta
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id_beta -p $PORT -o BatchMode=yes"
          SCP="scp -i $HOME/.ssh/id_beta -P $PORT -o BatchMode=yes"

          put() {
            local name
            name=$(basename "$1")
            $SCP "$1" "$SSH_USER@$SSH_HOST:$DEST/.upload-$name"
            $SSH "$SSH_USER@$SSH_HOST" "mv -f '$DEST/.upload-$name' '$DEST/$name'"
            echo "    $name"
          }
          for file in upload/*; do
            case "$file" in *.yml) ;; *) put "$file" ;; esac
          done
          for file in upload/beta*.yml; do put "$file"; done

          # Each manifest names the installer it points at, and that file has
          # to be there now.
          for manifest in upload/beta*.yml; do
            for file in $(grep -oE 'url: [^[:space:]]+' "$manifest" | sed 's/url: //' | sort -u); do
              $SSH "$SSH_USER@$SSH_HOST" "test -f '$DEST/$file'" || {
                echo "::error::$manifest verweist auf $file, das auf dem Server fehlt"
                exit 1
              }
            done
          done
          rm -f ~/.ssh/id_beta

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.beta != 'true'
        with:
          name: dist-${{ matrix.platform }}
          path: upload/
          retention-days: 1
          if-no-files-found: error

  # Takes the files of earlier betas off the server once all three platforms
  # have their new ones there. Skipped when any build failed, so a platform
  # whose build broke keeps the beta it had.
  beta-cleanup:
    needs: build
    if: contains(github.ref_name, '-beta.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Alte Betas vom Server nehmen
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          BETA_ROOT: ${{ secrets.BETA_ROOT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DEST="${BETA_ROOT:-/var/lib/launch-gabi-beta}"
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_beta
          chmod 600 ~/.ssh/id_beta
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Only installers and blockmaps of other versions. The manifests are
          # always the current ones, and anything else in the folder is left
          # alone.
          ssh -i ~/.ssh/id_beta -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "find '$DEST' -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.blockmap' -o -name '.upload-*' \) ! -name '*-$VERSION-*' ! -name '*-$VERSION.*' -print -delete"
          rm -f ~/.ssh/id_beta

  release:
    needs: build
    # A beta never becomes a GitHub release, see the top of this file.
    if: ${{ !contains(github.ref_name, '-beta.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Taken from package.json rather than the ref, so a manual re-run from
          # the Actions tab targets the same release a tag push would.
          TAG="v$(node -p "require('./package.json').version")"

          # Plain X.Y.Z only. A "-beta" suffix sorts above the final release
          # in the "latest" check below and would have reached every user
          # through the updater without being marked as a prerelease.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG ist keine einfache Version der Form X.Y.Z"
            exit 1
          fi

          # A pushed tag that does not match package.json would publish the
          # installers under a different version than they report.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($TAG)"
            exit 1
          fi

          # A manual run for a version that was never tagged used to create
          # the tag on the spot, at whatever commit the branch pointed to.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG existiert nicht. Erst taggen, dann bauen."
            exit 1
          fi

          # Only the highest version may be marked latest. Rebuilding an older
          # release by hand used to make it "latest" again, and every launcher
          # on a newer version was then offered that older one.
          HIGHEST=$( { gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'; echo "$TAG"; } | grep -E '^v[0-9]' | sort -V | tail -1)
          if [ "$HIGHEST" = "$TAG" ]; then LATEST=true; else LATEST=false; fi
          echo "Höchste Version: $HIGHEST, $TAG wird latest: $LATEST"

          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;

          echo "Dateien für $TAG:"
          ls -1 out

          # Recreated rather than appended to, so a re-run cannot leave assets
          # from an older build sitting next to the new ones.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Vorhandenes Release $TAG wird ersetzt"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            --latest="$LATEST" \
            out/*

      - name: Verify the release is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$ASSETS"

          # The three manifests are what the updater reads; a missing one means
          # that platform silently never updates, which is not worth shipping.
          for required in latest.yml latest-mac.yml latest-linux.yml; do
            echo "$ASSETS" | grep -qx "$required" || {
              echo "::error::$required fehlt im Release $TAG"
              exit 1
            }
          done

          # Each manifest names the installer it points at. Checking only that
          # the manifests exist left the actual failure uncovered: a rename in
          # electron-builder.yml that misses one of them publishes a feed which
          # sends every existing installation to a file that is not there, and
          # nothing about that looks wrong until users stop updating.
          MISSING=0
          for manifest in out/latest.yml out/latest-mac.yml out/latest-linux.yml; do
            [ -f "$manifest" ] || continue
            for file in $(grep -oE 'url: [^[:space:]]+' "$manifest" | sed 's/url: //' | sort -u); do
              if ! echo "$ASSETS" | grep -qx "$file"; then
                echo "::error::$manifest verweist auf $file, das nicht im Release liegt"
                MISSING=1
              fi
            done
          done
          [ "$MISSING" = "0" ] || exit 1

          # The failure this whole layout exists to prevent.
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name==\"$TAG\")] | length" | head -1)
          if [ "$COUNT" != "1" ]; then
            echo "::error::$COUNT Releases mit Tag $TAG gefunden, erwartet genau 1"
            exit 1
          fi

          echo "Release $TAG ist vollständig."
