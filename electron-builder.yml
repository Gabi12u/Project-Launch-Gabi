appId: gg.launchgabi.app
productName: Launch Gabi
copyright: Copyright © 2026 Launch Gabi

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  # `src/*` only matches direct children, and nothing lives directly in src/ —
  # so this excluded nothing and the whole uncompiled TypeScript tree shipped
  # inside app.asar next to the built output in every installer.
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Websites, Werkzeuge und der Fabric-Mod gehoeren nicht in den Installer.
  # Ohne diese Zeilen landet die komplette Website in app.asar, in jeder
  # Installation, obwohl der Launcher zur Laufzeit nichts davon liest.
  - '!docs/**'
  - '!status/**'
  - '!scripts/**'
  - '!mod/**'
  - '!TODO.md'

asarUnpack:
  - resources/**

# `build/` is the buildResources folder, which electron-builder excludes from
# the package — so the icon desktop shortcuts point at was never shipped and
# `appIconPath()` in src/main/core/shortcuts.ts found nothing in a real install.
extraResources:
  - from: build/icon.ico
    to: icon.ico

win:
  executableName: LaunchGabi
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Launch Gabi
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false

protocols:
  - name: Launch Gabi
    schemes: [launchgabi]

# Where the installed app looks for updates. This block is still required so
# electron-builder writes app-update.yml into the package and generates the
# latest*.yml manifests — but nothing here publishes any more. The release is
# assembled centrally in .github/workflows/release.yml, because three runners
# each creating their own release produced two releases for one tag.
publish:
  - provider: github
    owner: Gabi12u
    repo: Project-Launch-Gabi

# macOS and Linux are built on GitHub Actions runners -- neither target can be
# produced on Windows. See .github/workflows/release.yml.
mac:
  category: public.app-category.games
  icon: build/icon.png
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  # No Apple Developer certificate, so skip signing instead of failing the build.
  # Consequence: Gatekeeper warns on first launch and auto-update does not work
  # on macOS -- unsigned apps are not allowed to replace themselves.
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  category: Game
  icon: build/icon.png
  maintainer: Gabi
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
