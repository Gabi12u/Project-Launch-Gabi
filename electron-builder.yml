appId: gg.launchgabi.app
productName: Launch Gabi
copyright: Copyright © 2026 Launch Gabi

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**

win:
  executableName: LaunchGabi
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Launch Gabi
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false

protocols:
  - name: Launch Gabi
    schemes: [launchgabi]

# Where the installed app looks for updates. electron-builder bakes this into
# app-update.yml inside the package, so it has to be right BEFORE `npm run dist`.
# GitHub Releases needs no server of your own: publish the installer plus the
# generated latest.yml as release assets and the updater finds them.
publish:
  - provider: github
    owner: Gabi12u
    repo: Project-Launch-Gabi
    releaseType: release

# macOS and Linux are built on GitHub Actions runners -- neither target can be
# produced on Windows. See .github/workflows/release.yml.
mac:
  category: public.app-category.games
  icon: build/icon.png
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  # No Apple Developer certificate, so skip signing instead of failing the build.
  # Consequence: Gatekeeper warns on first launch and auto-update does not work
  # on macOS -- unsigned apps are not allowed to replace themselves.
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  category: Game
  icon: build/icon.png
  maintainer: Gabi
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
