<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falsch abgebogen: Launch Gabi</title>
<meta name="theme-color" content="#0a0512">
<!-- Die Fehlerseite selbst gehoert nicht in den Suchindex. -->
<meta name="robots" content="noindex, follow">

<!-- Absolute Pfade, keine relativen. nginx liefert diese Datei unter der
     urspruenglich aufgerufenen Adresse aus, ein Aufruf von /a/b/c wuerde
     Bilder sonst unter /a/b/assets/ suchen und nichts finden. -->
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">

<style>
  :root {
    --void:       #0a0512;
    --ink:        #f4ecff;
    --muted:      #bcaddb;
    --accent:     #c74dff;
    --accent-warm:#ff5cc8;
    --accent-deep:#7c2ae8;
    --glass:      rgba(255, 255, 255, 0.06);
    --glass-line: rgba(255, 255, 255, 0.14);
    --glass-lit:  rgba(255, 255, 255, 0.26);
    --r:    18px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--ink);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px 20px;
  }

  .bg {
    position: fixed;
    inset: -2%;
    z-index: 0;
    background: var(--void) url("/assets/end-bg.jpg") center 40% / cover no-repeat;
    opacity: 0;
    transition: opacity 1.1s var(--ease);
  }
  .bg.ready { opacity: 1; }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(110% 80% at 50% 30%,
        rgba(10, 5, 18, 0.42) 0%, rgba(10, 5, 18, 0.78) 55%, rgba(7, 3, 13, 0.94) 100%);
  }

  main { position: relative; z-index: 1; max-width: 620px; }

  /* Die grosse Zahl sitzt hinter dem Text und traegt die Stimmung, ohne
     mitgelesen zu werden. */
  .code {
    font-size: clamp(7rem, 26vw, 14rem);
    font-weight: 800;
    line-height: .82;
    letter-spacing: -.06em;
    margin: 0;
    background: linear-gradient(180deg, #ffffff 18%, #ecccff 62%, var(--accent-warm) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    /* Ohne diese Polsterung schneidet background-clip die Unterlaenge ab. */
    padding-bottom: .06em;
    filter: drop-shadow(0 6px 40px rgba(199, 77, 255, .45));
    user-select: none;
  }

  h1 {
    font-size: clamp(1.5rem, 5.5vw, 2.3rem);
    font-weight: 760;
    letter-spacing: -.028em;
    margin: 6px 0 14px;
  }

  p {
    color: var(--muted);
    margin: 0 auto 34px;
    max-width: 44ch;
    font-size: 1.02rem;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 48px;
    padding: 14px 26px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 680;
    font-size: .97rem;
    transition: transform .3s var(--ease), box-shadow .3s var(--ease),
                background .3s var(--ease), border-color .3s var(--ease);
  }

  .btn.primary {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    border: 1px solid rgba(255, 255, 255, .22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.34), 0 8px 26px rgba(199,77,255,.36);
  }
  .btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.44), 0 14px 36px rgba(199,77,255,.52);
  }

  .btn.ghost {
    color: var(--ink);
    background: var(--glass);
    border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    box-shadow: inset 0 1px 0 var(--glass-lit);
  }
  .btn.ghost:hover {
    transform: translateY(-2px);
    border-color: rgba(199, 77, 255, .5);
  }

  a:focus-visible {
    outline: 2px solid var(--accent-warm);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .bg { transition: none; }
    .btn:hover { transform: none; }
  }

  /* ---- language switch ---- */
  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    margin-bottom: 22px;
  }
  .lang-switch button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .03em;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .25s var(--ease), background .25s var(--ease);
  }
  .lang-switch button:hover { color: #fff; }
  .lang-switch button[aria-pressed="true"] {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  }
</style>
</head>
<body>

<div class="bg" id="bg" aria-hidden="true"></div>

<main>
  <div class="lang-switch" id="langSwitch" role="group" aria-label="Sprache wählen / Choose language">
    <button type="button" data-lang="de" aria-pressed="true">DE</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>

  <p class="code" aria-hidden="true">404</p>
  <h1 data-i18n="heading">Falsch abgebogen</h1>
  <p data-i18n="body">
    Diese Seite gibt es nicht. Vielleicht hat sich ein Tippfehler in die Adresse
    geschlichen, oder die Seite ist umgezogen.
  </p>

  <div class="actions">
    <a class="btn primary" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      <span data-i18n="btnHome">Zurück zur Startseite</span>
    </a>
    <a class="btn ghost" href="/#download" data-i18n="btnDownload">Zum Download</a>
  </div>
</main>

<script>
  // Same language dictionary approach as index.html (data-i18n attributes
  // plus a small t()), kept in sync with it by hand since this page only
  // has a handful of strings.
  var I18N = {
    de: {
      pageTitle: 'Falsch abgebogen: Launch Gabi',
      heading: 'Falsch abgebogen',
      body: 'Diese Seite gibt es nicht. Vielleicht hat sich ein Tippfehler in die Adresse geschlichen, oder die Seite ist umgezogen.',
      btnHome: 'Zurück zur Startseite',
      btnDownload: 'Zum Download'
    },
    en: {
      pageTitle: 'Wrong turn: Launch Gabi',
      heading: 'Wrong turn',
      body: 'This page does not exist. Maybe a typo snuck into the address, or the page has moved.',
      btnHome: 'Back to the homepage',
      btnDownload: 'Go to downloads'
    }
  };

  var LANG_KEY = 'lg-lang';
  var lang = 'de';
  try { lang = localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'de'; } catch (e) { /* storage unavailable, ignore */ }

  function applyLanguage() {
    document.documentElement.lang = lang;
    document.title = I18N[lang].pageTitle;

    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = I18N[lang][nodes[i].getAttribute('data-i18n')];
    }

    var buttons = document.querySelectorAll('.lang-switch button');
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].setAttribute('aria-pressed', buttons[j].getAttribute('data-lang') === lang ? 'true' : 'false');
    }
  }
  applyLanguage();

  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest && ev.target.closest('.lang-switch button');
    if (!btn) return;
    var picked = btn.getAttribute('data-lang');
    if ((picked !== 'de' && picked !== 'en') || picked === lang) return;
    lang = picked;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* storage unavailable, ignore */ }
    applyLanguage();
  });

  // Erst einblenden, wenn das Bild wirklich da ist. Schlaegt es fehl, bleibt
  // der dunkle Verlauf stehen statt eines halb geladenen Bildes.
  (function () {
    var bg = document.getElementById('bg');
    var img = new Image();
    img.addEventListener('load', function () { bg.classList.add('ready'); });
    img.src = '/assets/end-bg.jpg';
  })();
</script>

</body>
</html>
